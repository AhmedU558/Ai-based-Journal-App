services:
  mysql:
    image: mysql:8.0
    container_name: journal-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: journal-elasticsearch-prod
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data_prod:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: journal-redis-prod
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: journal-rabbitmq-prod
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  python-ai-service:
    build: ./python-ai-service
    container_name: python-ai-service-prod
    restart: always
    # Bound to localhost only: this Flask service has no authentication of
    # its own (JWT validation happens one layer up, in ai-service) and was
    # previously published on 0.0.0.0, letting anyone who could reach the
    # host hit /api/v1/ai/* directly - full AI functionality with no JWT, no
    # rate limiting, and (if HUGGINGFACE_API_KEY is set) free billable calls
    # to Hugging Face. ai-service reaches it via the internal Docker network
    # (FLASK_AI_URL above), which never needed the host port published at all.
    ports:
      - "127.0.0.1:5000:5000"
    # Both genuinely optional - real (non-fake) keyword/rule-based fallbacks
    # exist for /chat, /mood, and /summarize when unset, so there's no
    # required-with-no-default treatment here unlike JWT_SECRET/etc. Neither
    # was actually wired into this container before (HUGGINGFACE_API_KEY was
    # referenced only in the comment above), so even setting one in .env
    # never reached the process.
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server-prod
    restart: always
    ports:
      - "8761:8761"

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service-prod
    restart: always
    # Bound to localhost only: everything reaches this via the host-nginx ->
    # frontend-container -> gateway proxy chain (see frontend/nginx.conf).
    # Publishing this on 0.0.0.0 let anyone bypass that chain and hit the
    # gateway directly with a forged X-Forwarded-For/X-Real-IP header, which
    # ClientIpHeaderFilter/RateLimiterConfig would otherwise trust unconditionally.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      discovery-server:
        condition: service_started
      redis:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    container_name: auth-service-prod
    restart: always
    # Bound to localhost only, same reasoning as gateway-service/
    # python-ai-service/frontend above - this and the other 8 business
    # services below were the one class of service that never got this fix
    # applied. Publishing them on 0.0.0.0 let anyone bypass the gateway
    # entirely and hit e.g. /api/v1/auth/login directly, defeating the
    # Redis-backed RequestRateLimiter that only exists as a gateway route
    # filter - auth-service's own SecurityConfig permitAll()s these same
    # paths with no rate limiting of its own, so a direct hit had no limit
    # at all. ai-service reaches journal-service etc. via the internal
    # Docker network (see e.g. JOURNAL_SERVICE_URL-shaped env vars below),
    # which never needed the host port published either.
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be set}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY must be set}
    depends_on:
      mysql:
        condition: service_healthy

  user-service:
    build: ./user-service
    container_name: user-service-prod
    restart: always
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      mysql:
        condition: service_healthy

  journal-service:
    build: ./journal-service
    container_name: journal-service-prod
    restart: always
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/journal_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      SPRING_RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JOURNAL_ENCRYPTION_KEY: ${JOURNAL_ENCRYPTION_KEY:?JOURNAL_ENCRYPTION_KEY must be set}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  ai-service:
    build: ./ai-service
    container_name: ai-service-prod
    restart: always
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      AI_PROVIDER: flask
      FLASK_AI_URL: http://python-ai-service:5000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      mysql:
        condition: service_healthy
      python-ai-service:
        condition: service_started

  search-service:
    build: ./search-service
    container_name: search-service-prod
    restart: always
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  recommendation-service:
    build: ./recommendation-service
    container_name: recommendation-service-prod
    restart: always
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

  notification-service:
    build: ./notification-service
    container_name: notification-service-prod
    restart: always
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?SPRING_MAIL_HOST must be set - point at a real SMTP provider, no MailHog in prod}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:?SPRING_MAIL_PORT must be set}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?SPRING_MAIL_USERNAME must be set}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?SPRING_MAIL_PASSWORD must be set}
      SPRING_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: "true"
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:?NOTIFICATION_EMAIL_FROM must be set - the default (noreply@mindora.local) is not a real domain and will fail SPF/DKIM checks at every real mail provider}
    depends_on:
      mysql:
        condition: service_healthy

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service-prod
    restart: always
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

  file-service:
    build: ./file-service
    container_name: file-service-prod
    restart: always
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    volumes:
      - file_service_uploads_prod:/app/uploads

  frontend:
    build: ./frontend
    container_name: journal-frontend-prod
    restart: always
    # Bound to localhost only: a host-level nginx (outside this compose file,
    # see docs/DEPLOY.md) terminates TLS on 80/443 and reverse-proxies to
    # this port, so the container itself must not also claim the public port.
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - gateway-service

volumes:
  mysql_data_prod:
  elasticsearch_data_prod:
  file_service_uploads_prod:
