server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000

# The refresh-token cookie's Secure flag - real HTTPS in prod (default true),
# overridden to false only in local Docker dev where the whole stack runs
# over plain HTTP and a Secure cookie would silently never be sent.
auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

totp:
  encryption-key: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be set - copy .env.example to .env and fill it in}

# Blank (not required-fail-fast like the two secrets above) so local dev/CI
# never needs a real Cloudflare account - TurnstileService treats an unset
# secret as "skip verification" rather than permanently blocking register/login.
turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8087}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
