server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's own default (1MB) is well under a real profile-photo upload -
    # found live via a broken avatar-upload bug where a real photo either
    # got a raw HTML 413 or, worse, a partially-forwarded request body that
    # the upstream misreported as "not a multipart request".
    client_max_body_size 20m;

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes every filename under /assets/ (e.g.
    # index-BaQfNV3R.js) - a NEW deploy always ships a NEW filename, so it's
    # safe (and the whole point of the hashing) to cache these forever and
    # let the browser skip re-downloading them on every repeat visit. No
    # cache headers were being sent here at all before this, so every visit
    # re-fetched the full JS bundle.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API Proxy → Spring Cloud Gateway — forward ALL headers including Authorization
    location /api/ {
        proxy_pass http://gateway-service:8080/api/;
        proxy_http_version 1.1;

        # Forward Authorization header (JWT token)
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # CORS support. A wildcard '*' Allow-Origin combined with
        # Allow-Credentials: true is invalid per the CORS spec - browsers
        # reject that pairing outright for any credentialed request, so the
        # wildcard was never actually usable together with the credentials
        # header below. Reflecting the real request Origin (plus Vary:
        # Origin, so caches don't serve one origin's CORS headers to another)
        # is the standard fix that keeps both headers valid at once.
        add_header 'Access-Control-Allow-Origin'      $http_origin always;
        add_header 'Vary'                             'Origin' always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, X-User-Id, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Handle OPTIONS preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_read_timeout    90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout    90s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
