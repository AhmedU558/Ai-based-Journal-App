services:
  mysql:
    image: mysql:8.0
    container_name: journal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: journal-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: journal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: journal-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  mailhog:
    image: mailhog/mailhog
    container_name: journal-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  python-ai-service:
    build: ./python-ai-service
    container_name: python-ai-service
    # Bound to localhost only: this Flask service has no authentication of
    # its own (JWT validation happens one layer up, in ai-service) - same
    # reasoning already applied to the prod compose file's python-ai-service
    # block. ai-service reaches it via the internal Docker network
    # (FLASK_AI_URL), which never needed the host port published at all.
    ports:
      - "127.0.0.1:5000:5000"
    # Both genuinely optional - the /chat, /mood, and /summarize routes all
    # fall back to real (non-fake) keyword/rule-based logic when unset, so
    # there's no reason to require either for local dev. Previously neither
    # was actually wired into this container at all (HUGGINGFACE_API_KEY was
    # referenced only in a code comment), so even a real key in .env never
    # reached the process.
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}
    depends_on:
      discovery-server:
        condition: service_started
      redis:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be set - copy .env.example to .env and fill it in}
      # No :? required default like the two secrets above - an unset key makes
      # TurnstileService skip verification rather than block every
      # register/login, so local dev never needs a real Cloudflare account.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # This whole stack runs over plain HTTP in local dev (no TLS) - a
      # Secure=true refresh-token cookie would silently never be set/sent by
      # the browser over http://localhost, breaking login/refresh entirely.
      # Prod's compose file has no override, so it keeps the default true.
      AUTH_COOKIE_SECURE: "false"
    depends_on:
      mysql:
        condition: service_healthy

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}
    depends_on:
      mysql:
        condition: service_healthy

  journal-service:
    build: ./journal-service
    container_name: journal-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/journal_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}
      JOURNAL_ENCRYPTION_KEY: ${JOURNAL_ENCRYPTION_KEY:?JOURNAL_ENCRYPTION_KEY must be set - copy .env.example to .env and fill it in}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AI_PROVIDER: flask
      FLASK_AI_URL: http://python-ai-service:5000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}
    depends_on:
      mysql:
        condition: service_healthy
      python-ai-service:
        condition: service_started

  search-service:
    build: ./search-service
    container_name: search-service
    ports:
      - "8085:8085"
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  recommendation-service:
    build: ./recommendation-service
    container_name: recommendation-service
    ports:
      - "8086:8086"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    ports:
      - "8088:8088"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}

  file-service:
    build: ./file-service
    container_name: file-service
    ports:
      - "8089:8089"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and fill it in}
    volumes:
      - file_service_uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: journal-frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway-service

volumes:
  mysql_data:
  elasticsearch_data:
  file_service_uploads:
