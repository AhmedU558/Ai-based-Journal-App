# www -> apex, 301. Both hostnames resolve here and used to be served
# identically by the block below, which search engines treat as duplicate
# content and split ranking signals across. The canonical tag in index.html
# states a preference; this makes the duplicate stop existing.
#
# The certificate covers both names (SANs: mindorajournal.com,
# www.mindorajournal.com), so this block can terminate TLS for www and issue
# the redirect. ipv6only is deliberately not repeated here - it is set on the
# first block that binds [::]:443 and nginx rejects a conflicting repeat.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mindorajournal.com;

    ssl_certificate /etc/letsencrypt/live/mindorajournal.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mindorajournal.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://mindorajournal.com$request_uri;
}

server {
    server_name mindorajournal.com;

    location /downloads/ {
        alias /opt/mindora-static/downloads/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        client_max_body_size 20m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mindorajournal.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mindorajournal.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.mindorajournal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mindorajournal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mindorajournal.com www.mindorajournal.com;
    return 404; # managed by Certbot




}
