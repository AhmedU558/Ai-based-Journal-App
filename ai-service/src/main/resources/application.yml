server:
  port: 8084

spring:
  application:
    name: ai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    openai:
      api-key: demo-mock-key-123456

ai:
  provider: ${AI_PROVIDER:flask}
  flask:
    url: ${FLASK_AI_URL:http://python-ai-service:5000}

# Used by chatWithJournal's real mood-history retrieval (fetches the
# caller's own journals, forwarding their JWT, to answer "when was I
# happy/in a bad mood" questions with real dates instead of a canned reply).
journal:
  service:
    url: ${JOURNAL_SERVICE_URL:http://journal-service:8083}

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
